<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#05070b">
  <title>Seu acesso — Aqta</title>
  <meta name="description" content="Dados de acesso e primeiros passos no seu sistema Aqta.">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Michroma&display=swap">
  <link rel="stylesheet" href="/assets/css/aqta.css">
  <style>
    /* Estilos exclusivos da página /acesso (prefixo ac-). Componentes vêm de aqta.css. */
    .ac-main { width: 100%; max-width: 760px; margin: 0 auto; padding: 8px 16px 56px; box-sizing: border-box; }
    .ac-sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .ac-head { display: flex; justify-content: center; padding: 28px 16px 20px; }
    .ac-head img { height: 26px; width: auto; display: block; }

    .ac-steps { list-style: none; margin: 0 0 20px; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .ac-step { position: relative; padding-top: 12px; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
      color: var(--text, #e8edf3); }
    .ac-step::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; border-radius: 2px;
      background: linear-gradient(90deg, var(--cyan-deep, #0a84c6), var(--cyan, #01bffd)); }
    .ac-step span { font-family: var(--font-display, "Michroma", sans-serif); font-size: 10px; margin-right: 6px; color: var(--cyan, #01bffd); }
    .ac-step[data-s="wait"]::before { background: linear-gradient(90deg, #f5b544 0 50%, var(--line, #1c2633) 50%); }

    .ac-card { padding: 32px 28px; }
    .ac-card + .ac-card { margin-top: 16px; }
    .ac-title { font-family: var(--font-display, "Michroma", sans-serif); font-weight: 400; font-size: 20px; line-height: 1.35;
      letter-spacing: .02em; margin: 10px 0 10px; color: var(--text, #e8edf3); }
    .ac-title:focus { outline: none; }
    .ac-title:focus-visible { outline: 1px dashed var(--cyan, #01bffd); outline-offset: 4px; }
    .ac-h2 { font-family: var(--font-display, "Michroma", sans-serif); font-weight: 400; font-size: 14px; letter-spacing: .04em;
      margin: 0 0 14px; color: var(--text, #e8edf3); }
    .ac-lead { margin: 0 0 20px; color: var(--muted, #8a94a3); font-size: 14px; line-height: 1.6; max-width: 58ch; }
    .ac-lead strong { color: var(--text, #e8edf3); font-weight: 600; }
    .ac-center { text-align: center; padding: 24px 0; }
    .ac-center .ac-lead { margin-left: auto; margin-right: auto; }

    .ac-data { margin: 0; display: grid; grid-template-columns: minmax(120px, 34%) 1fr; border-top: 1px solid var(--line, #1c2633); }
    .ac-data dt, .ac-data dd { margin: 0; padding: 11px 0; border-bottom: 1px solid var(--line, #1c2633); font-size: 13px; }
    .ac-data dt { color: var(--muted, #8a94a3); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; padding-top: 13px; }
    .ac-data dd { color: var(--text, #e8edf3); word-break: break-word; min-width: 0; }
    .ac-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; letter-spacing: .04em; }

    .ac-secret { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .ac-secret output { padding: 6px 10px; border: 1px solid rgba(1, 191, 253, .35); border-radius: 6px;
      background: rgba(1, 191, 253, .06); min-width: 12ch; }
    .ac-inline { display: inline-flex; gap: 6px; }

    .ac-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .ac-note { font-size: 12px; color: var(--muted, #8a94a3); line-height: 1.6; margin: 14px 0 0; }
    .ac-note a, .ac-lead a { color: var(--cyan, #01bffd); }

    .ac-steps-list { list-style: none; margin: 0; padding: 0; counter-reset: acs; display: grid; gap: 10px; }
    .ac-steps-list li { position: relative; counter-increment: acs; padding: 12px 14px 12px 52px; font-size: 13px; line-height: 1.6;
      color: var(--muted, #8a94a3); border: 1px solid var(--line, #1c2633); border-left: 2px solid var(--cyan, #01bffd);
      border-radius: 0 8px 8px 0; background: var(--surface-2, #101620); }
    .ac-steps-list li::before { content: counter(acs, decimal-leading-zero); position: absolute; left: 14px; top: 12px;
      font-family: var(--font-display, "Michroma", sans-serif); font-size: 11px; color: var(--cyan, #01bffd); }
    .ac-steps-list strong { color: var(--text, #e8edf3); font-weight: 600; display: block; font-size: 13px; }
    .ac-steps-list code { font-size: 12px; color: var(--cyan-glow, #00e0ff); }

    .ac-foot { text-align: center; font-size: 12px; color: var(--muted, #8a94a3); margin-top: 28px; }
    .ac-foot a { color: var(--muted, #8a94a3); }

    @media (max-width: 560px) {
      .ac-card { padding: 24px 18px; }
      .ac-data { grid-template-columns: 1fr; }
      .ac-data dt { border-bottom: 0; padding-bottom: 0; }
      .ac-data dd { padding-top: 4px; }
      .ac-actions .btn { width: 100%; justify-content: center; }
      .ac-step { font-size: 9px; letter-spacing: .14em; }
    }
  </style>
</head>
<body class="page-shell" data-support-whatsapp="5521999999999">
  <a class="ac-sr" href="#ac-root">Pular para o conteúdo</a>
  <header class="ac-head">
    <a class="logo" href="/" aria-label="Aqta — página inicial">
      <img src="/assets/img/logo-aqta.svg" alt="Aqta" width="120" height="26">
    </a>
  </header>

  <main class="ac-main" id="ac-root" tabindex="-1">
    <ol class="ac-steps" aria-label="Etapas da contratação">
      <li class="ac-step"><span>01</span>Pagamento</li>
      <li class="ac-step"><span>02</span>Ativação</li>
      <li class="ac-step" id="ac-step-3"><span>03</span>Acesso</li>
    </ol>

    <div id="ac-view" aria-live="polite">
      <section class="frame ac-card">
        <div class="ac-center" role="status">
          <span class="spinner" aria-hidden="true"></span>
          <p class="ac-lead">Carregando seus dados de acesso…</p>
        </div>
      </section>
    </div>

    <noscript>
      <p class="alert alert--warn">Ative o JavaScript para ver seus dados de acesso.</p>
    </noscript>

    <p class="ac-foot">Aqta · Desenvolvimento de software · <a href="/">Voltar ao site</a></p>
  </main>

  <script type="module" src="/assets/js/acesso.js"></script>
</body>
</html>
