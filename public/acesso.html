<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#05070b">
  <title>Seu acesso — Aqta</title>
  <meta name="description" content="Dados de acesso e primeiros passos no seu sistema Aqta.">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Michroma&display=swap">
  <link rel="stylesheet" href="/assets/css/aqta.css">
  <style>
    /* Estilos exclusivos da página /acesso (prefixo ac-). Componentes vêm de aqta.css. */
    #ac-root { grid-template-columns: minmax(0, 1fr); }
    .ac-wrap { width: 100%; max-width: 760px; min-width: 0; display: grid; gap: 20px; justify-self: center; }
    .ac-progress { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .ac-progress li { position: relative; padding-top: 12px; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--text); }
    .ac-progress li::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; border-radius: 2px;
      background: linear-gradient(90deg, var(--cyan-deep), var(--cyan)); }
    .ac-progress span { font-family: var(--font-display); font-size: 10px; margin-right: 6px; color: var(--cyan); }
    .ac-progress li[data-s="wait"]::before { background: linear-gradient(90deg, var(--warn) 0 50%, var(--line) 50%); }
    .ac-progress li[data-s="wait"] span { color: var(--warn); }
    #ac-view { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
    #ac-view .page-shell__card { max-width: none; }
    .ac-head { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
    .ac-title:focus { outline: none; }
    .ac-h2 { font-family: var(--font-display); font-weight: 400; font-size: 14px; letter-spacing: .04em; margin: 0; }
    .ac-summary dd { word-break: break-word; }
    .ac-summary .input-group { max-width: 340px; margin-left: auto; }
    .ac-note { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 0; }
    .ac-note a, .page-shell__lead a { color: var(--cyan); }
    .steps code { font-family: var(--font-mono, monospace); font-size: 12px; color: var(--cyan-glow); }
    .ac-center { display: grid; justify-items: center; gap: 12px; padding: 24px 0; text-align: center; }
    @media (max-width: 560px) {
      .ac-summary > div { flex-direction: column; gap: 4px; }
      .ac-summary dd { text-align: left; }
      .ac-summary .input-group { max-width: none; margin-left: 0; }
      .ac-progress li { font-size: 9px; letter-spacing: .12em; }
    }
  </style>
</head>
<body class="page-shell" data-support-whatsapp="5521999999999">
  <a class="sr-only" href="#ac-root">Pular para o conteúdo</a>
  <header class="page-shell__header">
    <div class="container page-shell__bar">
      <a class="logo" href="/" aria-label="Aqta — página inicial"><img src="/assets/img/logo-aqta.svg" alt="Aqta" width="120" height="30"></a>
      <nav class="page-shell__nav" aria-label="Ajuda"><a id="ac-help" href="https://wa.me/5521999999999" target="_blank" rel="noopener">Suporte</a></nav>
    </div>
  </header>

  <main class="page-shell__main" id="ac-root" tabindex="-1">
    <div class="ac-wrap">
      <ol class="ac-progress" aria-label="Etapas da contratação">
        <li><span>01</span>Pagamento</li>
        <li><span>02</span>Ativação</li>
        <li id="ac-step-3" aria-current="step"><span>03</span>Acesso</li>
      </ol>

      <div id="ac-view">
        <section class="frame page-shell__card">
          <div class="ac-center">
            <span class="spinner spinner--lg" role="status"><span class="sr-only">Carregando</span></span>
            <p class="page-shell__lead">Carregando seus dados de acesso…</p>
          </div>
        </section>
      </div>
      <p class="sr-only" id="ac-live" aria-live="polite"></p>

      <noscript><p class="alert alert--warn">Ative o JavaScript para ver seus dados de acesso.</p></noscript>
    </div>
  </main>

  <footer class="page-shell__footer">
    <div class="container"><span>Aqta · Desenvolvimento de software</span><a href="/">Voltar ao site</a></div>
  </footer>

  <script type="module" src="/assets/js/acesso.js"></script>
</body>
</html>
